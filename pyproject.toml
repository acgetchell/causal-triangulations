[project]
name = "causal-triangulations-environment"
version = "0.0.0"
description = "Dependency-only environment for CDT notebooks and tooling checks"
requires-python = ">=3.15"
dependencies = [  ]

[tool.ruff]
line-length = 160
src = [ "tests" ]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "EXE",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "NPY",
    "RUF",
]
extend-select = [ "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206" ]
fixable = [ "ALL" ]
unfixable = [  ]
ignore = [
    # Formatter conflicts
    "COM812",
    "ISC001",

    # CLI script patterns
    "PLR2004",
    "FBT001",
    "FBT002",
    "BLE001",
    "T201",
    "TRY300",
    "TRY301",
    "ARG001",
    "ERA001",
    "EXE001",
    "PTH123",
    "N806",
    "EM102",
    "TRY003",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tooling/verify_registry_candidate.py" = [ "INP001" ] # Standalone entry point in the tagged CDT deployment.
"tests/tooling/test_*.py" = [ "S101", "SLF001" ]
"docs/audits/2d-cdt_sphere/checks/test_*.py" = [ "S101" ]
"tests/semgrep/scripts/tests/python_exceptions.py" = [
    "INP001", # Scanner input, not an importable package.
    "Q000", # Both quote styles exercise the encoding rule.
    "S110", # Deliberate except/pass fixtures.
    "S607", # Direct subprocess negative fixture.
    "SIM105", # Preserve explicit handlers for Semgrep.
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true
order-by-type = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--color=yes" ]
testpaths = [ "tests/tooling", "docs/audits/2d-cdt_sphere" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]
markers = [ "semgrep_report: verify the complete portable Semgrep scan and its SARIF workflow" ]

[tool.uv]
package = false
required-version = "==0.13.10"
# Semgrep's sdist does not bundle its required native engine.
no-build-package = [ "semgrep" ]
# Root overrides mirror RRT's semgrep-constraints.txt because uv applies them only here.
override-dependencies = [
    "jsonschema==4.26.0",
    "mcp==1.30.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-threading==0.66b2",
    "pywin32==312; sys_platform == 'win32'",
    "tomli==2.5.0",
    "wcmatch==11.2", # GHSA-53pm-wgxf-c6qf. Remove when Semgrep accepts a patched release.
]

[tool.uv.dependency-groups]
tooling = { requires-python = ">=3.15" }
notebooks = { requires-python = ">=3.15" }

[dependency-groups]
build = [
    "cython==3.3.1",
    "hatchling==1.33.0",
    "requests==2.34.2",
    "semver==3.1.1",
    "setuptools==84.2.1",
    "wheel==0.48.0",
]
dev = [
    { include-group = "tooling" },
    "actionlint-py==1.7.12.25",
    "research-repo-tools[python-tools,semgrep]==0.3.3",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "yamllint==1.38.0",
]
notebooks = [
    "research-repo-tools[notebooks,python-tools]==0.3.3",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
    "polars>=1.43.2",
]
tooling = [ "research-repo-tools[python-tools]==0.3.3" ]

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "causal-triangulations"
formatter = "rumdl.toml"
date-source = "citation"

[tool.research-repo-tools.publishing]
registry = "crates-io"
package = "causal-triangulations"
repository = "acgetchell/causal-triangulations"
expected-title = "tag"
generated-notes = true
require-immutable = true
required-checks = [
    { name = "repository-tooling", app-id = 15368 },
    { name = "build (ubuntu-latest)", app-id = 15368 },
    { name = "build (macos-latest)", app-id = 15368 },
    { name = "build (windows-latest)", app-id = 15368 },
    { name = "package", app-id = 15368 },
    { name = "sign-package", app-id = 15368 },
    { name = "Clippy SARIF Analysis", app-id = 15368 },
    { name = "Repository Rule SARIF Analysis", app-id = 15368 },
    { name = "Analyze (actions)", app-id = 15368 },
    { name = "Analyze (rust)", app-id = 15368 },
    { name = "GitHub Actions Security Analysis", app-id = 15368 },
    { name = "Gitleaks secret scan", app-id = 15368 },
    { name = "OSV dependency scan", app-id = 15368 },
]
required-assets = [ "causal-triangulations-{version}.crate", "causal-triangulations-v{version}-cdt-series.tar.gz", "policy.json", "acceptance.json" ]

[tool.research-repo-tools.toolchain]
inherit-python = true
inherit-python-tools = true

[tool.research-repo-tools.toolchain.binaries]
gitleaks = "8.30.1"
osv-scanner = "2.7.1"

[tool.research-repo-tools.toolchain.cargo]
cargo-audit = "0.23.0"
cargo-edit = "0.13.14"
cargo-llvm-cov = "0.9.2"
cargo-machete = "0.10.1"
cargo-nextest = "0.9.152"
clippy-sarif = "0.8.0"
dprint = "0.65.0"
git-cliff = "2.14.2"
rumdl = "0.3.6"
sarif-fmt = "0.8.0"
taplo-cli = "0.10.0"
typos-cli = "1.52.2"
zizmor = "1.33.1"

[tool.research-repo-tools.zizmor]
persona = "regular"

[tool.research-repo-tools.notebooks]
group = "notebooks"
cwd = "."
output-dir = "target/notebooks"
# The analysis cell runs two simulations with 900-second subprocess limits.
timeout = 1860
outputs = "clear"
prohibit-installs = true

[tool.research-repo-tools.notebooks.lab]
browser = true
scratch-dir = "target/notebooks"

[tool.research-repo-tools.semgrep]
config = "semgrep.yaml"
fixtures = "tests/semgrep"
namespace = "causal-triangulations."
cwd = "."
batch-size = 50
inline-suppressions = false
jobs = 1
report-category = "semgrep-repository-rules"
report-layout = "aggregate"
rustdoc-include = [ "src/**/*.rs", "examples/**/*.rs", "benches/**/*.rs", "tests/**/*.rs" ]
target-timeout = 30
timeout = 300

[tool.research-repo-tools.release]
date-policy = "declared"
tag-policy = "canonical-stable"
required-files = [ "Cargo.lock", "pyproject.toml", "uv.lock", "CITATION.cff", "CHANGELOG.md", "README.md" ]
exclude = [ "docs/archive/**", "docs/performance/**" ]

[[tool.research-repo-tools.release.rules]]
path = "CITATION.cff"
pattern = '\A(?![\s\S]*^identifiers:)[\s\S]*?^doi: (?P<value>[^\s]+)[ \t]*\r?$'
value = "10.5281/zenodo.20513228"
