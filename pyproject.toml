[project]
name = "causal-triangulations-environment"
version = "0.0.0"
description = "Dependency-only environment for CDT notebooks and tooling checks"
requires-python = ">=3.14"
dependencies = [  ]

[tool.ruff]
line-length = 160
target-version = "py314"
src = [ "scripts" ]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "EXE",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "NPY",
    "RUF",
]
extend-select = [ "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206" ]
fixable = [ "ALL" ]
unfixable = [  ]
ignore = [
    # Formatter conflicts
    "COM812",
    "ISC001",

    # CLI script patterns
    "PLR2004",
    "FBT001",
    "FBT002",
    "BLE001",
    "T201",
    "TRY300",
    "TRY301",
    "ARG001",
    "ERA001",
    "EXE001",
    "PTH123",
    "N806",
    "EM102",
    "TRY003",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/test_*.py" = [ "S101", "SLF001" ]
"tests/semgrep/scripts/tests/python_exceptions.py" = [
    "INP001", # Scanner input, not an importable package.
    "Q000", # Both quote styles exercise the encoding rule.
    "S110", # Deliberate except/pass fixtures.
    "S607", # Direct subprocess negative fixture.
    "SIM105", # Preserve explicit handlers for Semgrep.
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true
order-by-type = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--color=yes" ]
testpaths = [ "scripts/tests" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]

[tool.uv]
package = false
required-version = "==0.12.23"

[tool.uv.dependency-groups]
tooling = { requires-python = ">=3.14" }
notebooks = { requires-python = ">=3.14" }

[dependency-groups]
dev = [
    { include-group = "tooling" },
    "actionlint-py==1.7.12.25",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "semgrep==1.179.0",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "ty==0.0.84",
    "yamllint==1.38.0",
]
notebooks = [
    "research-repo-tools[notebooks]==0.1.7",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
    "polars>=1.43.2",
]
tooling = [ "research-repo-tools==0.1.7" ]

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "causal-triangulations"
formatter = "rumdl.toml"

[tool.research-repo-tools.toolchain]
inherit-python = true

[tool.research-repo-tools.toolchain.binaries]
gitleaks = "8.30.1"
osv-scanner = "2.6.0"

[tool.research-repo-tools.toolchain.cargo]
cargo-audit = "0.22.2"
cargo-edit = "0.13.13"
cargo-llvm-cov = "0.9.1"
cargo-machete = "0.9.2"
cargo-nextest = "0.9.146"
clippy-sarif = "0.8.0"
dprint = "0.60.1"
git-cliff = "2.14.2"
rumdl = "0.2.78"
sarif-fmt = "0.8.0"
taplo-cli = "0.10.0"
typos-cli = "1.51.0"
zizmor = "1.30.1"

[tool.research-repo-tools.zizmor]
persona = "regular"

[tool.research-repo-tools.notebooks]
group = "notebooks"
cwd = "."
output-dir = "target/notebooks"
timeout = 600
outputs = "clear"
prohibit-installs = true

[tool.research-repo-tools.semgrep]
config = "semgrep.yaml"
fixtures = "tests/semgrep"
namespace = "causal-triangulations."
cwd = "."

[tool.research-repo-tools.release]
date-policy = "declared"
tag-policy = "canonical-stable"
required-files = [ "Cargo.lock", "pyproject.toml", "uv.lock", "CITATION.cff", "CHANGELOG.md", "README.md" ]
exclude = [ "docs/archive/**", "docs/performance/**" ]

[[tool.research-repo-tools.release.rules]]
path = "CITATION.cff"
pattern = '\A(?![\s\S]*^identifiers:)[\s\S]*?^doi: (?P<value>[^\s]+)[ \t]*\r?$'
value = "10.5281/zenodo.20513228"
