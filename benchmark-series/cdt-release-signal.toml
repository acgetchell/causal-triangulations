[[suites]]
name = "cdt"
contract = "cdt-2d-release-signal-v1"
nominal-seconds-per-case = 3

[suites.measurement]
schema = 4
backend = "export"
harness-mode = "independent"
sources = [ "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "src/**/*.rs", "tests/**/*.rs" ]
harness = [ "benches/ci_performance_suite.rs", "benches/support/or_abort.rs" ]
workloads = [ "benches/ci_performance_suite.rs", "benches/support/or_abort.rs" ]
raw-files = [ "tukey.json" ]
saved-sample = "retained"
sample-count = 10
statistics = [ "mean", "median" ]
confidence-level = 0.95
unit = "ns"
timeout = 7200
compatible = [ "context.os", "context.architecture", "context.cpu" ]

[suites.measurement.probes]
build-policy = [
    "python",
    "-I",
    "-c",
    """import json, os, tomllib; from pathlib import Path; \
    manifest = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8')); \
    keys = {'RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTC','RUSTC_WRAPPER','RUSTC_WORKSPACE_WRAPPER',\
    'RUSTUP_TOOLCHAIN','CARGO_INCREMENTAL','CARGO_BUILD_TARGET','CARGO_BUILD_RUSTFLAGS'}; \
    flags = {k:v for k,v in os.environ.items() if k in keys or k.startswith('CARGO_PROFILE_') \
    or (k.startswith('CARGO_TARGET_') and k.endswith(('_RUSTFLAGS','_LINKER','_RUNNER')))}; \
    print(json.dumps({'profile':manifest.get('profile'),'features':manifest.get('features'),'environment':flags}, sort_keys=True))""",
]
cargo = [ "cargo", "--version" ]
rustc = [ "rustc", "--version", "--verbose" ]

criterion = [ "cargo", "pkgid", "--locked", "--offline", "--package", "criterion" ]
delaunay = [ "cargo", "pkgid", "--locked", "--offline", "--package", "delaunay" ]
la-stack = [ "cargo", "pkgid", "--locked", "--offline", "--package", "la-stack" ]
markov-chain-monte-carlo = [ "cargo", "pkgid", "--locked", "--offline", "--package", "markov-chain-monte-carlo" ]

[suites.measurement.context]
repository = "acgetchell/causal-triangulations"
acquisition-owner = "local"
profile = "perf"

[suites.measurement.phases.baseline]
command = [ "cargo", "bench", "--locked", "--profile", "perf", "--bench", "ci_performance_suite", "--", "--save-baseline=retained", "--noplot" ]
gate = [ "cargo", "test", "--locked", "--release", "--test", "integration_tests", "--test", "physics_integration" ]
environment = { CRITERION_HOME = "target/criterion", CARGO_TARGET_DIR = "target", CARGO_INCREMENTAL = "0" }

[suites.measurement.phases.baseline.discovery]
required = [ "cdt_state_dependent_policy_2d/single_metropolis_proposal" ]
suites = [ { name = "cdt", command = [ "cargo", "bench", "--locked", "--profile", "perf", "--bench", "ci_performance_suite", "--", "--list" ] } ]

[suites.measurement.phases.current]
command = [ "cargo", "bench", "--locked", "--profile", "perf", "--bench", "ci_performance_suite", "--", "--save-baseline=retained", "--noplot" ]
gate = [ "cargo", "test", "--locked", "--release", "--test", "integration_tests", "--test", "physics_integration" ]
environment = { CRITERION_HOME = "target/criterion", CARGO_TARGET_DIR = "target", CARGO_INCREMENTAL = "0" }

[suites.measurement.phases.current.discovery]
required = [ "cdt_state_dependent_policy_2d/single_metropolis_proposal" ]
suites = [ { name = "cdt", command = [ "cargo", "bench", "--locked", "--profile", "perf", "--bench", "ci_performance_suite", "--", "--list" ] } ]

[[suites.measurement.series]]
name = "baseline"
phase = "baseline"
select = { include = [ "*" ] }

[[suites.measurement.series]]
name = "current"
phase = "current"
select = { include = [ "*" ] }
