[package]
name = "causal-triangulations"
version = "0.1.0"
authors = [ "Adam Getchell <adam@adamgetchell.org>" ]
categories = [ "science", "mathematics", "algorithms", "simulation" ]
edition = "2024"
documentation = "https://docs.rs/causal-triangulations"
homepage = "https://github.com/acgetchell/causal-triangulations"
keywords = [
    "quantum-gravity",
    "spacetime",
    "simulation",
    "triangulation",
    "causal",
]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/acgetchell/causal-triangulations"
rust-version = "1.97.1"
description = "Validated 1+1 Causal Dynamical Triangulations for quantum gravity"

# Features removed - backend system is now internal implementation detail
# Both delaunay and mock backends are always compiled

[[bin]]
name = "cdt"
path = "src/main.rs"

[[bench]]
name = "cdt_benchmarks"
harness = false

[[bench]]
name = "ci_performance_suite"
harness = false

[features]
slow-tests = [  ]

[package.metadata.docs.rs]
all-features = true

[profile.perf]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.5", features = [ "derive" ] }
delaunay = "0.8.0"
markov-chain-monte-carlo = { version = "0.4.0", features = [ "serde" ] }
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
num-traits = "0.2.19"
rand = { version = "0.10.2", features = [ "serde" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
approx = "0.5.1"
slotmap = "1.1.1"
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = [ "html_reports" ] }
predicates = "3.1.4"
proptest = "1.11.0"

[lints.rust]
unexpected_cfgs = "warn"
unsafe_code = "forbid"
dead_code = "warn"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
extra_unused_type_parameters = "warn"
pedantic = { level = "warn", priority = -1 }
# Allow multiple crate versions due to transitive dependencies
multiple_crate_versions = "allow"
