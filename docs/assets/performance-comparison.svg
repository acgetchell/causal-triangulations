<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Performance change for v0.1.1 versus v0.1.0</title>
<desc id="desc">Bars left of center are faster and bars right of center are slower. Values come from the retained performance CSV.</desc>
