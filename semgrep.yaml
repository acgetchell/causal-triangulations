---
# Repository-owned Semgrep rules.
#
# Keep this file small and project-specific. Broad default/community rules have
# been noisy for Rust libraries and duplicate CodeQL, cargo-audit, Clippy, Ruff,
# and ShellCheck coverage.

rules:
  - id: causal-triangulations.rust.no-stdio-diagnostics-in-src
    languages:
      - rust
    severity: WARNING
    message: "Use log macros for production diagnostics instead of stdout/stderr macros."
    metadata:
      category: maintainability
      rationale: "Runtime diagnostics should be filterable through log/env_logger."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
      exclude:
        - "/examples/**"
        - "/benches/**"
    patterns:
      - pattern-either:
          - pattern: println!(...)
          - pattern: eprintln!(...)
      - pattern-not: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          impl $TYPE {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          impl $TYPE {
              ...
          }

  - id: causal-triangulations.rust.no-env-gated-stdio-diagnostics
    languages:
      - rust
    severity: WARNING
    message: "Environment-gated diagnostics should use log macros instead of stdio macros."
    metadata:
      category: maintainability
      rationale: "Debug hooks should remain filterable through log/env_logger."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-either:
      - pattern: |
          if std::env::var_os($NAME).is_some() {
              ...
              println!(...);
              ...
          }
      - pattern: |
          if std::env::var_os($NAME).is_some() {
              ...
              eprintln!(...);
              ...
          }
      - pattern: |
          if env::var_os($NAME).is_some() {
              ...
              println!(...);
              ...
          }
      - pattern: |
          if env::var_os($NAME).is_some() {
              ...
              eprintln!(...);
              ...
          }

  - id: causal-triangulations.rust.no-nonfinite-unwrap-defaults
    languages:
      - rust
    severity: WARNING
    message: "Do not hide failed floating-point conversion with NaN or infinity defaults."
    metadata:
      category: correctness
      rationale: >-
        CDT acceptance rates and probability-like calculations should reject or
        handle failed numeric conversion explicitly instead of substituting
        non-finite values.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-either:
      - pattern: $VALUE.unwrap_or(f64::NAN)
      - pattern: $VALUE.unwrap_or(f64::INFINITY)
      - pattern: $VALUE.unwrap_or(f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or(std::f64::NAN)
      - pattern: $VALUE.unwrap_or(std::f64::INFINITY)
      - pattern: $VALUE.unwrap_or(std::f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| f64::NAN)
      - pattern: $VALUE.unwrap_or_else(|| f64::INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| std::f64::NAN)
      - pattern: $VALUE.unwrap_or_else(|| std::f64::INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| std::f64::NEG_INFINITY)

  - id: causal-triangulations.rust.no-silent-conversion-fallbacks
    languages:
      - rust
    severity: WARNING
    message: "Handle numeric conversion failures explicitly instead of hiding them behind unwrap_or fallbacks."
    metadata:
      category: correctness
      rationale: >-
        CDT observable and topology calculations should preserve conversion
        failure context or choose an explicit failure branch rather than
        silently substituting sentinel values.
      ported_from: "delaunay.rust.no-silent-conversion-fallbacks"
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: NumCast::from($VALUE).unwrap_or($FALLBACK)
          - pattern: NumCast::from($VALUE).unwrap_or_else($FALLBACK)
          - pattern: num_traits::NumCast::from($VALUE).unwrap_or($FALLBACK)
          - pattern: num_traits::NumCast::from($VALUE).unwrap_or_else($FALLBACK)
          - pattern: cast::<$FROM, $TO>($VALUE).unwrap_or($FALLBACK)
          - pattern: cast::<$FROM, $TO>($VALUE).unwrap_or_else($FALLBACK)
          - pattern: num_traits::cast::<$FROM, $TO>($VALUE).unwrap_or($FALLBACK)
          - pattern: num_traits::cast::<$FROM, $TO>($VALUE).unwrap_or_else($FALLBACK)
          - patterns:
              - pattern: $SAFE(...).unwrap_or($FALLBACK)
              - metavariable-regex:
                  metavariable: $SAFE
                  regex: safe_[A-Za-z0-9_]+
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          mod prop_tests {
              ...
          }
      - pattern-not-inside: |
          mod integration_tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          impl $TYPE {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          impl $TYPE {
              ...
          }

  - id: causal-triangulations.rust.no-partial-cmp-ordering-defaults
    languages:
      - rust
    severity: WARNING
    message: "Handle incomparable partial_cmp results explicitly instead of defaulting to an Ordering."
    metadata:
      category: correctness
      rationale: >-
        Geometry and observable ordering code should document the impossible or
        incomparable branch instead of silently folding it into Equal, Less, or
        Greater.
      ported_from: "delaunay.rust.no-partial-cmp-ordering-defaults"
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: $LEFT.partial_cmp($RIGHT).unwrap_or(Ordering::$ORDER)
          - pattern: $LEFT.partial_cmp($RIGHT).unwrap_or(std::cmp::Ordering::$ORDER)
          - pattern: $LEFT.partial_cmp($RIGHT).unwrap_or_else($FALLBACK)
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }

  - id: causal-triangulations.rust.no-function-local-use-in-src
    languages:
      - rust
    severity: WARNING
    message: "Move source imports to module scope instead of declaring use items inside functions."
    metadata:
      category: maintainability
      rationale: >-
        Function-local imports obscure dependency shape and make it easier for
        tests and production code to drift into different styles.
      ported_from: "delaunay.rust.no-function-local-use-in-src"
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern: use $PATH;
      - pattern-inside: |
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }

  - id: causal-triangulations.rust.no-bare-unwrap-in-src
    languages:
      - rust
    severity: WARNING
    message: "Use typed error handling or an explicit fallback instead of unwrap() in production src/."
    metadata:
      category: correctness
      rationale: >-
        Production library code should preserve recoverable failures and
        document intentional fallbacks rather than panicking through bare
        unwrap().
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
      exclude:
        - "/tests/semgrep/src/project_rules/bench_example_usage.rs"
    patterns:
      - pattern: $VALUE.unwrap()
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          mod prop_tests {
              ...
          }
      - pattern-not-inside: |
          mod integration_tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          impl $TYPE {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          impl $TYPE {
              ...
          }

  - id: causal-triangulations.rust.no-unwrap-expect-in-doctests
    languages:
      - generic
    severity: WARNING
    message: "Use fallible doctest flow instead of unwrap() or expect() in public documentation examples."
    metadata:
      category: correctness
      rationale: >-
        Public Rust documentation examples should model typed error handling
        with CdtResult and ? rather than teaching panic-based control flow.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/doctests/**/*.txt"
      exclude:
        - "/tests/semgrep/src/**"
    pattern-regex: '^\s*//[!/]\s*(?:#\s*)?.*(?:\b[\w:]+|[\]\)])\.(unwrap|expect)\s*\('

  - id: causal-triangulations.rust.prefer-assert-matches-in-doctests
    languages:
      - generic
    severity: WARNING
    message: "Use assert_matches! (std::assert_matches) instead of assert!(matches!(...)) in public documentation examples."
    metadata:
      category: maintainability
      rationale: >-
        Public Rust documentation examples should teach std::assert_matches,
        which reports the unmatched value on failure instead of the bare
        boolean that assert!(matches!(...)) produces.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/doctests/**/*.txt"
    pattern-regex: '^\s*//[!/].*\bassert!\s*\(\s*matches!\s*\('

  - id: causal-triangulations.rust.no-unwrap-expect-in-benches-examples
    languages:
      - rust
    severity: WARNING
    message: "Use explicit fixture error handling instead of unwrap() or expect() in benchmarks and examples."
    metadata:
      category: correctness
      rationale: >-
        Benchmarks and public examples should keep failure modes explicit so
        users and CI see the operation that failed instead of a panic-only
        unwrap/expect path.
    paths:
      include:
        - "/benches/**/*.rs"
        - "/examples/**/*.rs"
        - "/tests/semgrep/src/project_rules/bench_example_usage.rs"
    patterns:
      - pattern-either:
          - pattern: $VALUE.unwrap()
          - pattern: $VALUE.expect(...)
      - pattern-not-inside: |
          fn production_unwrap_and_panic_fixture(result: Result<u32, &'static str>, value: Option<u32>) {
              // Fixture path: tests/semgrep/src/project_rules/rust_style.rs.
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn test_only_unwrap_and_panic_fixture(result: Result<u32, &'static str>) {
              // Fixture path: tests/semgrep/src/project_rules/rust_style.rs.
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod prop_tests {
              fn helper(result: Result<u32, &'static str>) {
                  // Fixture path: tests/semgrep/src/project_rules/rust_style.rs.
                  ...
              }
          }

  - id: causal-triangulations.rust.no-panic-in-src
    languages:
      - rust
    severity: WARNING
    message: "Return a typed error or Option instead of panicking in production src/."
    metadata:
      category: correctness
      rationale: >-
        Public and production CDT APIs should report failures through typed
        results unless an invariant violation is deliberately confined to tests.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: panic!(...)
          - pattern: std::panic!(...)
          - pattern: core::panic!(...)
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          mod prop_tests {
              ...
          }
      - pattern-not-inside: |
          mod integration_tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          impl $TYPE {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          impl $TYPE {
              ...
          }

  - id: causal-triangulations.rust.no-public-unchecked-apis
    languages:
      - rust
    severity: WARNING
    message: "Keep *_unchecked APIs private so invalid-state escape hatches do not become public contracts."
    metadata:
      category: correctness
      rationale: >-
        Unchecked helpers should stay behind validated CDT constructors,
        parsers, or setters rather than becoming public API contracts.
      ported_from: "mcmc.rust.no-public-unchecked-apis"
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-regex: '^\s*pub(?:\([^)]*\))?\s+(?:const\s+|async\s+|unsafe\s+)?fn\s+[A-Za-z_][A-Za-z0-9_]*_unchecked\s*\('
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          fn $FUNC(...) {
              ...
          }

  - id: causal-triangulations.rust.no-direct-delaunay-imports-outside-geometry
    languages:
      - rust
    severity: WARNING
    message: "Keep direct delaunay imports inside src/geometry; use CDT geometry abstractions elsewhere."
    metadata:
      category: architecture
      rationale: >-
        CDT physics should depend on the trait-based geometry layer rather than
        the concrete delaunay backend.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
      exclude:
        - "/src/geometry/**/*.rs"
    pattern-regex: >-
      (?mx)^\s*
      (?:pub(?:\([^)]*\))?\s+)?
      use\s+delaunay
      (?:
        \s+as\s+[A-Za-z_][A-Za-z0-9_]*
        |::(?:[^;\n]*\{[\s\S]*?\}|[^;\n]+)
        |\s*
      )
      \s*;

  - id: causal-triangulations.rust.no-direct-mcmc-imports-outside-metropolis
    languages:
      - rust
    severity: WARNING
    message: "Keep direct markov-chain-monte-carlo imports at the CDT Metropolis adapter boundary."
    metadata:
      category: architecture
      rationale: >-
        Generic MCMC mechanics should remain delegated through the CDT
        Metropolis adapter and public re-export surfaces instead of leaking
        across unrelated CDT modules.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
      exclude:
        - "/src/cdt/metropolis/**/*.rs"
        - "/src/errors.rs"
        - "/src/lib.rs"
    pattern-regex: >-
      (?mx)^\s*
      (?:pub(?:\([^)]*\))?\s+)?
      use\s+markov_chain_monte_carlo
      (?:
        \s+as\s+[A-Za-z_][A-Za-z0-9_]*
        |::(?:[^;\n]*\{[\s\S]*?\}|[^;\n]+)
        |\s*
      )
      \s*;

  - id: causal-triangulations.rust.no-local-metropolis-acceptance-draws
    languages:
      - rust
    severity: WARNING
    message: "Delegate Metropolis-Hastings acceptance draws to markov-chain-monte-carlo instead of recomputing exp(log_alpha) locally."
    metadata:
      category: architecture
      rationale: >-
        CDT owns proposal planning and telemetry, while markov-chain-monte-carlo
        owns generic Metropolis-Hastings acceptance, RNG draws, and delayed
        proposal commit ordering.
      issue: "https://github.com/acgetchell/causal-triangulations/issues/155"
    paths:
      include:
        - "/src/cdt/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-regex: '\brandom\s*::\s*<\s*f64\s*>\s*\(\s*\)\s*<=?\s*[^;\n]*\.exp\s*\('
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: causal-triangulations.rust.no-local-mcmc-chain-counter-increments
    languages:
      - rust
    severity: WARNING
    message: "Use upstream Chain/Sampler counters instead of maintaining local generic accepted/rejected MCMC counters."
    metadata:
      category: architecture
      rationale: >-
        CDT may translate upstream outcomes into domain telemetry, but generic
        accepted/rejected sampler counters should remain owned by
        markov-chain-monte-carlo.
      issue: "https://github.com/acgetchell/causal-triangulations/issues/155"
    paths:
      include:
        - "/src/cdt/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern-regex: '\baccepted\s*(?:\+=|=\s*accepted\s*\+)'
          - pattern-regex: '\brejected\s*(?:\+=|=\s*rejected\s*\+)'
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: causal-triangulations.rust.planned-step-info-not-proposal-cache
    languages:
      - rust
    severity: WARNING
    message: "Use the planned step's returned info for runtime bookkeeping; keep proposal cache reads to debug/test checks."
    metadata:
      category: correctness
      rationale: >-
        Planned-proposal telemetry should come from the step returned by the
        upstream sampler. Reading CdtProposal::last_step_info() as the runtime
        source of truth can drift from the authoritative sampler result.
    paths:
      include:
        - "/src/cdt/metropolis/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern: $SAMPLER.proposal_ref().last_step_info()
      - pattern-not-inside: |
          debug_assert_eq!(
              $SAMPLER.proposal_ref().last_step_info(),
              ...,
              ...
          );
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }

  - id: causal-triangulations.rust.planned-step-record-requires-sampler-state-sync
    languages:
      - rust
    severity: WARNING
    message: "Sync the annotated CDT state back into the sampler after recording a planned proposal step."
    metadata:
      category: correctness
      rationale: >-
        CDT records metadata and history after planned-proposal outcomes, while
        the upstream sampler owns the state used by later proposals. Advancing
        the step counter without sampler.replace_state(...) can discard those
        annotations on a later handoff.
    paths:
      include:
        - "/src/cdt/metropolis/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-regex: >-
      (?s)record_planned_step\([^;]*\)\?;\s*
      (?:(?!replace_state\s*\().)*?
      state\.current_step\s*=

  - id: causal-triangulations.rust.expect-requires-reason
    languages:
      - rust
    severity: WARNING
    message: 'Add reason = "..." to #[expect(...)] so lint suppressions remain auditable.'
    metadata:
      category: maintainability
      rationale: >-
        Repository guidance prefers documented lint expectations over
        unexplained suppressions.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/benches/**/*.rs"
    patterns:
      # Regex keeps this intentionally scoped to one-line `#[expect(...)]`
      # attributes; multiline attributes remain a review concern.
      - pattern-regex: '^\s*#\s*\[\s*expect\s*\([^\]\n]*\)\s*\]'
      - pattern-not-regex: '\breason\s*='

  - id: causal-triangulations.rust.no-clippy-allow-lints
    languages:
      - rust
    severity: WARNING
    message: "Use #[expect(..., reason = ...)] instead of #[allow(...)] for Clippy suppressions."
    metadata:
      category: maintainability
      rationale: >-
        Clippy suppressions should be checked by the compiler and carry a
        stable reason so stale suppressions are noticed during linting.
      ported_from: "delaunay.rust.no-clippy-allow-lints"
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/benches/**/*.rs"
      exclude:
        - "/tests/semgrep/.github/**"
        - "/tests/semgrep/doctests/**"
        - "/tests/semgrep/docs/**"
        - "/tests/semgrep/scripts/**"
    pattern-regex: '^\s*#\s*\[\s*allow\s*\(\s*clippy::'

  - id: causal-triangulations.rust.no-box-dyn-error-in-src
    languages:
      - rust
    severity: WARNING
    message: "Use a typed error enum in production src/ instead of Box<dyn Error>, &dyn Error, or anyhow::Error."
    metadata:
      category: maintainability
      rationale: >-
        Public and production fallible paths should preserve typed error
        contracts rather than erasing error shape behind dynamic errors.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
      exclude:
        - "/examples/**"
        - "/benches/**"
        - "/tests/semgrep/src/project_rules/bench_example_usage.rs"
    patterns:
      # Regex is deliberate here: Rust AST patterns over-match associated
      # error types such as serde's `S::Error`; this rule is about exact
      # dynamic-error spellings in production code.
      - pattern-regex: >-
          ^[ \t]*[^\n]*(\bBox\s*<\s*dyn\s+(std::error::)?Error\b|&\s*dyn\s+(std::error::)?Error\b|\banyhow::Error\b)
      - pattern-not-regex: '^[ \t]*(//|///|/\*|\*)'
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          fn $FUNC(...) {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          impl $TYPE {
              ...
          }
      - pattern-not-inside: |
          #[cfg(any(test, ...))]
          impl $TYPE {
              ...
          }

  - id: causal-triangulations.rust.no-box-dyn-error-in-examples-benches
    languages:
      - rust
    severity: WARNING
    message: "Use CdtResult or a concrete crate error in examples and benchmarks instead of dynamic error erasure."
    metadata:
      category: maintainability
      rationale: >-
        Examples and benchmarks should model typed error handling that users
        can copy into their own code.
      ported_from: "mcmc.rust.no-box-dyn-error-in-examples-benches"
    paths:
      include:
        - "/examples/**/*.rs"
        - "/benches/**/*.rs"
        - "/tests/semgrep/src/project_rules/bench_example_usage.rs"
    patterns:
      - pattern-regex: >-
          ^[ \t]*[^\n]*(\bBox\s*<\s*dyn\s+(std::error::)?Error\b|&\s*dyn\s+(std::error::)?Error\b|\banyhow::Error\b)
      - pattern-not-regex: '^[ \t]*(//|///|/\*|\*)'

  - id: causal-triangulations.rust.no-box-dyn-error-in-doctests
    languages:
      - generic
    severity: WARNING
    message: "Use concrete error types in doctests instead of Box<dyn Error> or other dynamic error erasure."
    metadata:
      category: maintainability
      rationale: >-
        Doctests are public examples and should model typed, copyable error
        handling with CdtResult or concrete errors.
      ported_from: "mcmc.rust.no-box-dyn-error-in-doctests"
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/doctests/**/*.txt"
      exclude:
        - "/tests/semgrep/src/**"
    pattern-either:
      - pattern-regex: >-
          ^\s*(//!|///)[^\n]*dyn\s+(std::error::)?Error
      - pattern-regex: >-
          ^\s*(//!|///)[^\n]*anyhow::Error
      - pattern-regex: >-
          (?s)/\*\*.*?(Box\s*<\s*dyn\s+(std::error::)?Error|&\s*dyn\s+(std::error::)?Error|anyhow::Error).*?\*/
      - pattern-regex: >-
          (?s)/\*!.*?(Box\s*<\s*dyn\s+(std::error::)?Error|&\s*dyn\s+(std::error::)?Error|anyhow::Error).*?\*/

  - id: causal-triangulations.rust.public-error-enums-non-exhaustive
    languages:
      - rust
    severity: WARNING
    message: "Public error enums must be #[non_exhaustive] so adding variants remains API-safe."
    metadata:
      category: maintainability
      rationale: >-
        Error enums grow as diagnostics become more precise; non-exhaustive
        public enums keep that growth additive for downstream callers.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern: |
          pub enum $X {
              $Y
          }
      - metavariable-regex:
          metavariable: $X
          regex: ".*Error$"
      - pattern-not: |
          #[non_exhaustive]
          pub enum $X {
              $Y
          }

  - id: causal-triangulations.rust.prefer-focused-prelude-imports-in-public-usage
    languages:
      - rust
    severity: WARNING
    message: >-
      Use causal_triangulations::prelude focused imports in examples,
      benchmarks, and integration tests instead of deep crate module paths.
    metadata:
      category: maintainability
      rationale: >-
        Public-facing usage should model the small, orthogonal prelude import
        surfaces users can copy into their own code.
    paths:
      include:
        - "/examples/**/*.rs"
        - "/benches/**/*.rs"
        - "/tests/**/*.rs"
    pattern-regex: >-
      ^\s*use\s+causal_triangulations::(?:cdt|geometry)::

  - id: causal-triangulations.rust.no-stringly-domain-validation-errors
    languages:
      - rust
    severity: WARNING
    message: "Use the dedicated CdtError variant instead of stringly ValidationFailed for this domain."
    metadata:
      category: maintainability
      rationale: >-
        Topology, foliation, and unsupported construction failures have typed
        variants; routing them through ValidationFailed loses programmatic
        debuggability.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-regex: >-
      (?s)CdtError::ValidationFailed\s*\{(?=[^}]*\bcheck\s*:\s*(?:"(?:foliation|topology|cdt_construction)"(?:\s*\.\s*(?:to_string|into)\s*\(\s*\))?|String\s*::\s*from\s*\(\s*"(?:foliation|topology|cdt_construction)"\s*\)))[^}]*\}

  - id: causal-triangulations.docs.check-before-fix-command-order
    languages:
      - regex
    severity: WARNING
    message: "Document non-mutating just checks before mutating just fixers."
    metadata:
      category: maintainability
      tracking_issue: "https://github.com/acgetchell/causal-triangulations/issues/129"
      rationale: >-
        User-facing workflow examples should show non-mutating checks before
        mutating fixers so formatting drift is inspected before files are
        rewritten.
    paths:
      include:
        - "/**/*.md"
        - "/justfile"
        - "/tests/semgrep/docs/**/*.sh"
    pattern-either:
      - pattern-regex: '(?ms)^\s*(?:@echo\s+"?\s*)?just\s+fix\b[^\n]*(?:\n\s*(?:#[^\n]*)?)*?\n\s*(?:@echo\s+"?\s*)?just\s+check(?:\s|$|")' # yamllint disable-line rule:line-length
      - pattern-regex: '(?ms)^\s*(?:@echo\s+"?\s*)?just\s+python-fix\b[^\n]*(?:\n\s*(?:#[^\n]*)?)*?\n\s*(?:@echo\s+"?\s*)?just\s+python-check\b' # yamllint disable-line rule:line-length
      - pattern-regex: '(?ms)^\s*(?:@echo\s+"?\s*)?just\s+yaml-fix\b[^\n]*(?:\n\s*(?:#[^\n]*)?)*?\n\s*(?:@echo\s+"?\s*)?just\s+yaml-check\b' # yamllint disable-line rule:line-length
      - pattern-regex: '(?ms)^\s*(?:@echo\s+"?\s*)?just\s+markdown-fix\b[^\n]*(?:\n\s*(?:#[^\n]*)?)*?\n\s*(?:@echo\s+"?\s*)?just\s+markdown-check\b' # yamllint disable-line rule:line-length
      - pattern-regex: '(?ms)^\s*(?:@echo\s+"?\s*)?just\s+toml-fix\b[^\n]*(?:\n\s*(?:#[^\n]*)?)*?\n\s*(?:@echo\s+"?\s*)?just\s+toml-check\b' # yamllint disable-line rule:line-length
      - pattern-regex: '(?ms)^\s*(?:@echo\s+"?\s*)?just\s+shell-fix\b[^\n]*(?:\n\s*(?:#[^\n]*)?)*?\n\s*(?:@echo\s+"?\s*)?just\s+shell-check\b' # yamllint disable-line rule:line-length

  - id: causal-triangulations.cli.prefer-vertices-per-slice-in-user-facing-runs
    languages:
      - regex
    severity: WARNING
    message: "Use --vertices-per-slice in user-facing cdt commands; reserve --vertices for compatibility prose and low-level tests."
    metadata:
      category: maintainability
      rationale: >-
        User-facing binary examples should model the spatial-slice parameter
        users actually choose, leaving the total vertex count as a derived value.
    paths:
      include:
        - "/README.md"
        - "/docs/**/*.md"
        - "/examples/scripts/**/*.md"
        - "/examples/scripts/**/*.sh"
        - "/tests/semgrep/docs/**/*.sh"
    pattern-either:
      - pattern-regex: '(?m)^\s*(?:RUST_LOG=\S+\s+)?(?:\./target/(?:debug|release)/)?cdt\b[^\n]*\s--vertices(?:\s|=)' # yamllint disable-line rule:line-length
      - pattern-regex: '(?m)^\s*cargo\s+run\b[^\n]*--bin\s+cdt\b[^\n]*--\s+[^\n]*--vertices(?:\s|=)' # yamllint disable-line rule:line-length
      - pattern-regex: '(?m)^\s*--vertices(?:\s|=)'

  - id: causal-triangulations.github-actions.external-action-sha-pinned
    languages:
      - regex
    severity: WARNING
    message: "Pin external GitHub Actions to a full 40-character commit SHA."
    metadata:
      category: security
      tracking_issue: "https://github.com/acgetchell/causal-triangulations/issues/129"
      rationale: "Moving tags can change workflow behavior without review."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*uses:\s*(?!\./)(?!docker://)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?@(?![a-fA-F0-9]{40}(?:\s+#|$))[^\s#]+' # yamllint disable-line rule:line-length

  - id: causal-triangulations.github-actions.external-action-approved-allowlist
    languages:
      - regex
    severity: WARNING
    message: "Use only approved external GitHub Actions, or update the repository allowlist deliberately."
    metadata:
      category: security
      tracking_issue: "https://github.com/acgetchell/causal-triangulations/issues/129"
      rationale: "A small allowlist keeps workflow supply-chain review explicit."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*uses:\s*(?!\./)(?!docker://)(?!(?:actions/checkout|actions/cache|actions/upload-artifact|actions/github-script|actions/setup-python|actions-rust-lang/setup-rust-toolchain|astral-sh/setup-uv|taiki-e/cache-cargo-install-action|github/codeql-action/(?:upload-sarif|init|analyze)|codecov/codecov-action|zizmorcore/zizmor-action)@)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?@' # yamllint disable-line rule:line-length

  - id: causal-triangulations.github-actions.external-action-version-comment
    languages:
      - regex
    severity: WARNING
    message: "Keep a readable version comment next to external GitHub Action SHA pins."
    metadata:
      category: maintainability
      tracking_issue: "https://github.com/acgetchell/causal-triangulations/issues/129"
      rationale: "Version comments make Dependabot updates and human review manageable."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*uses:\s*(?!\./)(?!docker://)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?@[a-fA-F0-9]{40}\s*$' # yamllint disable-line rule:line-length

  - id: causal-triangulations.github-actions.checkout-persist-credentials-false
    languages:
      - regex
    severity: WARNING
    message: "Set persist-credentials: false on actions/checkout steps."
    metadata:
      category: security
      rationale: "Checkout credentials should not remain available to later workflow steps unless a job explicitly needs them."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^[ \t]*(?:-[ \t]*)?uses:[ \t]*actions/checkout@[a-fA-F0-9]{40}[^\n]*\n(?!(?:[ \t]*with:\n)?(?:[ \t]{10,}\S[^\n]*\n){0,8}[ \t]{10,}persist-credentials:[ \t]*false\b)' # yamllint disable-line rule:line-length

  - id: causal-triangulations.github-actions.no-pull-request-target
    languages:
      - regex
    severity: WARNING
    message: "Avoid pull_request_target; use pull_request unless a workflow has a documented security review."
    metadata:
      category: security
      rationale: "pull_request_target runs with base-repository privileges and is risky for workflows that touch untrusted PR content."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    pattern-regex: '(?m)^\s*pull_request_target\s*:'

  - id: causal-triangulations.github-actions.github-script-no-expression-interpolation
    languages:
      - regex
    severity: WARNING
    message: "Pass GitHub expression values to actions/github-script through env instead of interpolating inside script blocks."
    metadata:
      category: security
      rationale: "Interpolating ${{ ... }} directly into JavaScript can turn workflow context strings into executable code."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    patterns:
      - pattern-regex: '(?ms)^\s*script:\s*\|\n(?:(?!^\s*-\s+(?:name|uses):).)*\$\{\{' # yamllint disable-line rule:line-length

  - id: causal-triangulations.github-actions.uv-sync-locked-in-workflows
    languages:
      - regex
    severity: WARNING
    message: "Use uv sync --locked in GitHub Actions workflows."
    metadata:
      category: reproducibility
      rationale: "Workflow dependency installs should fail on lockfile drift instead of silently resolving new versions."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/tests/semgrep/.github/workflows/**/*.yml"
        - "/tests/semgrep/.github/workflows/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*(?:run:\s*)?uv\s+sync\b(?![^\n]*\s--locked\b)[^\n]*$' # yamllint disable-line rule:line-length

  - id: causal-triangulations.python.no-raw-exception-in-tests
    languages:
      - python
    severity: WARNING
    message: "Raise a specific exception type in Python tests instead of raw Exception."
    metadata:
      category: maintainability
      rationale: "Typed exceptions make test failures and expected errors easier to diagnose."
    paths:
      include:
        - "/scripts/tests/**/*.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
    pattern: raise Exception(...)

  - id: causal-triangulations.python.explicit-path-text-encoding-in-tests
    languages:
      - python
    severity: WARNING
    message: "Pass encoding=\"utf-8\" to Path.read_text/write_text in Python tests."
    metadata:
      category: portability
      rationale: >-
        Test fixtures that omit an explicit encoding can pass on UTF-8 platforms
        while failing on Windows when benchmark output contains Unicode symbols.
    paths:
      include:
        - "/scripts/tests/**/*.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $PATH.read_text(...)
              - pattern-not: $PATH.read_text(..., encoding="utf-8", ...)
              - pattern-not: $PATH.read_text(..., encoding='utf-8', ...)
              - pattern-not: $PATH.read_text(..., encoding=UTF8, ...)
          - patterns:
              - pattern: $PATH.write_text(...)
              - pattern-not: $PATH.write_text(..., encoding="utf-8", ...)
              - pattern-not: $PATH.write_text(..., encoding='utf-8', ...)
              - pattern-not: $PATH.write_text(..., encoding=UTF8, ...)

  - id: causal-triangulations.python.no-broad-exception
    languages:
      - python
    severity: WARNING
    message: "Catch a specific exception type instead of broad Exception."
    metadata:
      category: maintainability
      rationale: >-
        Python tooling should surface expected failure modes explicitly instead
        of swallowing unrelated errors.
    paths:
      include:
        - "/scripts/**/*.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
    pattern-regex: '^\s*except\s+Exception(?:\s+as\s+\w+)?\s*:'

  - id: causal-triangulations.python.no-adhoc-completedprocess-mock
    languages:
      - python
    severity: WARNING
    message: "Use subprocess.CompletedProcess[str] instead of ad hoc Mock stdout/returncode objects."
    metadata:
      category: maintainability
      rationale: >-
        Command-wrapper tests should use the real subprocess result shape so
        mocks stay aligned with production subprocess APIs.
    paths:
      include:
        - "/scripts/tests/**/*.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $PROC = Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = unittest.mock.Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = mock.Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = MagicMock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = unittest.mock.MagicMock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = mock.MagicMock(...)
                  ...
                  $PROC.stdout = ...
      - patterns:
          - pattern-either:
              - pattern: |
                  $PROC = Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = unittest.mock.Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = mock.Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = MagicMock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = unittest.mock.MagicMock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = mock.MagicMock(...)
                  ...
                  $PROC.returncode = ...
      - pattern: Mock(..., stdout=..., ...)
      - pattern: unittest.mock.Mock(..., stdout=..., ...)
      - pattern: mock.Mock(..., stdout=..., ...)
      - pattern: MagicMock(..., stdout=..., ...)
      - pattern: unittest.mock.MagicMock(..., stdout=..., ...)
      - pattern: mock.MagicMock(..., stdout=..., ...)
      - pattern: Mock(..., returncode=..., ...)
      - pattern: unittest.mock.Mock(..., returncode=..., ...)
      - pattern: mock.Mock(..., returncode=..., ...)
      - pattern: MagicMock(..., returncode=..., ...)
      - pattern: unittest.mock.MagicMock(..., returncode=..., ...)
      - pattern: mock.MagicMock(..., returncode=..., ...)

  - id: causal-triangulations.python.no-direct-subprocess-run-outside-wrapper
    languages:
      - python
    severity: WARNING
    message: "Use subprocess_utils command wrappers instead of calling subprocess.run directly."
    metadata:
      category: security
      rationale: >-
        Support scripts should inherit the repository's subprocess hardening
        for executable resolution, shell rejection, text output, and timeouts.
    paths:
      include:
        - "/scripts/**/*.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
      exclude:
        - "/scripts/subprocess_utils.py"
        - "/scripts/tests/**/*.py"
    pattern: subprocess.run(...)

  - id: causal-triangulations.python.no-untyped-defs-in-scripts
    languages:
      - python
    severity: WARNING
    message: "Add an explicit return annotation to script functions."
    metadata:
      category: maintainability
      rationale: "Typed script helpers are easier for ty and reviewers to reason about."
    paths:
      include:
        - "/scripts/archive_changelog.py"
        - "/scripts/benchmark_models.py"
        - "/scripts/coverage_report.py"
        - "/scripts/postprocess_changelog.py"
        - "/scripts/subprocess_utils.py"
        - "/scripts/tag_release.py"
        - "/tests/semgrep/scripts/tests/**/*.py"
    # Regex catches obvious unannotated definitions while avoiding a custom
    # Python parser rule that would duplicate ty.
    pattern-regex: '^( {0,4}|\t)(async\s+)?def\s+[A-Za-z_][A-Za-z0-9_]*\([^#\n]*\)\s*:'
