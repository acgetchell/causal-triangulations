[project]
name = "causal-triangulations-semgrep"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [ "semgrep==1.182.1" ]

[tool.uv]
package = false
# Semgrep's sdist does not bundle its required native engine.
no-build-package = [ "semgrep" ]
# Retain the patched MCP 1.x API until Semgrep updates its vulnerable pin.
override-dependencies = [ "mcp>=1.30.0,<2" ]
