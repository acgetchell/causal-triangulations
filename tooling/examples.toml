schema = 1
package = "causal-triangulations"
profile = "release"
timeout = 600
build-timeout = 1800

[examples.basic_cdt]
expect-stderr = [ "Simulation completed!", "Example completed successfully!" ]

[examples.find_good_seeds]
expect = [ "SEED VALIDATION", "ADDITIONAL SEED TESTING" ]

[examples.observables]
expect = [ "Initial slab-triangle profile", "Final all-scale effective Hausdorff slope", "Final short-time effective spectral dimension" ]

[examples.output_and_checkpoint]
expect = [ "Trace CSV rows", "JSON summary measurements", "Resumed MCMC checkpoint steps", "Output and checkpoint example completed successfully" ]

[examples.validation_diagnostics]
expect = [ "Cadence-aligned chain artifacts", "Diagnostic information verdict", "Raw chains and diagnostics" ]
