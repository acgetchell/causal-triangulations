name: Dependabot approval and auto-merge

# Trusted base-branch policy only; the reusable job never checks out or runs PR code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - main

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  approve-and-enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@cbb2ea6dee8866b3f0547bca935aef48fdd71707 # reviewed 2026-09-28
    with:
      repository: acgetchell/causal-triangulations
      policy: >-
        {"cargo": {
          "files": ["Cargo.toml", "Cargo.lock"]
        }, "uv": {
          "files": ["pyproject.toml", "uv.lock"]
        }, "github_actions": {
          "files": [
            ".github/actions/setup-toolchain/action.yml",
            ".github/workflows/audit.yml",
            ".github/workflows/ci.yml",
            ".github/workflows/codecov.yml",
            ".github/workflows/codeql.yml",
            ".github/workflows/dependabot-auto-merge.yml",
            ".github/workflows/gitleaks.yml",
            ".github/workflows/osv.yml",
            ".github/workflows/performance.yml",
            ".github/workflows/release-benchmarks.yml",
            ".github/workflows/rust-clippy.yml",
            ".github/workflows/semgrep-sarif.yml",
            ".github/workflows/zizmor.yml"
          ]
        }}
