name: Release benchmark assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  benchmark:
    name: Build native Criterion baseline
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          cache-bin: false

      - name: Set up just
        uses: $/.github/actions/setup-just

      - name: Resolve uv version
        id: uv_version
        run: |
          version="$(just --evaluate uv_version)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve uv_version from justfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.uv_version.outputs.version }}
          prune-cache: true

      - name: Verify synchronized release metadata
        run: just release-version-check

      - name: Measure and save the tagged Criterion baseline
        run: just bench-save-baseline "$RELEASE_TAG"

      - name: Package path-safe native benchmark evidence
        run: |
          asset="causal-triangulations-${RELEASE_TAG}-criterion-baseline.tar.gz"
          uv run release-performance package-baseline --tag "$RELEASE_TAG" --output "target/release-assets/$asset"

      - name: Transfer release asset to publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-release-baseline
          path: target/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach native baseline to GitHub Release
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: criterion-release-baseline
          path: release-assets

      - name: Publish durable release-native asset
        run: |
          asset="causal-triangulations-${RELEASE_TAG}-criterion-baseline.tar.gz"
          test -f "release-assets/$asset"
          gh release upload "$RELEASE_TAG" "release-assets/$asset" --repo "${GITHUB_REPOSITORY}" --clobber
