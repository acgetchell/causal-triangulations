name: Release Benchmarks
run-name: Release benchmark ${{ inputs.tag }}

# Both jobs operate on inert bytes with the isolated release runtime.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag with a draft GitHub Release
        required: true
        type: string
      transfer:
        description: Original complete staging receipt
        required: true
        type: string
      digest:
        description: Independently retained SHA-256 of the staging receipt
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_ASSET: causal-triangulations-${{ inputs.tag }}-cdt-series.tar.gz

jobs:
  validate-release:
    if: github.repository == 'acgetchell/causal-triangulations' && github.actor == 'acgetchell' && github.triggering_actor == 'acgetchell'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.release-target.outputs.target }}
      commit: ${{ steps.release-target.outputs.commit }}
    steps:
      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          enable-cache: false
          cache-python: false

      - name: Capture verified draft GitHub Release target
        id: release-target
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || { echo "Dispatch ref must match the release tag." >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Dispatch source must be a full commit SHA." >&2; exit 1; }
          target="$(uvx --no-config --isolated --managed-python --python 3.15 --exclude-newer 2026-11-26T03:45:46Z \
            --from research-repo-tools==0.3.3 research-repo-tools performance release-draft "$GH_REPO" "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --expected-title "$RELEASE_TAG")"
          target="$(jq -ce . <<< "$target")"
          printf 'target=%s\ncommit=%s\n' "$target" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  verify-attachment:
    needs: validate-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          enable-cache: false
          cache-python: false

      - name: Verify the staged archive against its accepted acquisition
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ needs.validate-release.outputs.target }}
          TRANSFER: ${{ inputs.transfer }}
          TRANSFER_SHA256: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          printf '%s\n' "$RELEASE_TARGET" > target.json
          printf '%s' "$TRANSFER" > transfer.json
          runtime=(uvx --no-config --isolated --managed-python --python 3.15 --exclude-newer 2026-11-26T03:45:46Z
            --from research-repo-tools==0.3.3 research-repo-tools)
          "${runtime[@]}" release assets receive --transfer transfer.json --transfer-sha256 "$TRANSFER_SHA256" --target target.json --output staged
          "${runtime[@]}" release evidence archive verify --policy staged/policy.json --acceptance staged/acceptance.json \
            --archive "staged/$RELEASE_ASSET" --target target.json

      - name: Retain the verified attachment receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-attachment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transfer.json
          if-no-files-found: error
          retention-days: 30
