name: Release Benchmarks
run-name: Release benchmark ${{ inputs.release_tag }}

# Write-token jobs install registry tooling and never check out benchmark code.
# Keep both resolution cutoffs aligned with the reviewed uv.lock snapshot.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag with a draft GitHub Release
        required: true
        type: string

concurrency:
  group: release-benchmarks-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_ASSET: causal-triangulations-${{ inputs.release_tag }}-cdt-baseline-v2.tar.gz
  RUST_BACKTRACE: 1

jobs:
  validate-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Validate draft GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          uvx --no-config --isolated --managed-python --exclude-newer 2026-09-26T20:01:10Z
          --from research-repo-tools==0.1.7 research-repo-tools performance release-draft "$GH_REPO" "$RELEASE_TAG"

  release-baseline:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          cache: "false"

      - name: Measure and package shared release baseline
        run: |
          just release-version-check
          just performance-baseline "$RELEASE_TAG"

      - name: Upload temporary baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-baseline-${{ inputs.release_tag }}
          path: ${{ env.RELEASE_ASSET }}
          retention-days: 30
          if-no-files-found: error

  publish-baseline:
    needs: release-baseline
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Download release baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-baseline-${{ inputs.release_tag }}

      - name: Attach verified baseline to draft GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          uvx --no-config --isolated --managed-python --exclude-newer 2026-09-26T20:01:10Z
          --from research-repo-tools==0.1.7 research-repo-tools performance release-upload "$GH_REPO" "$RELEASE_TAG" "$RELEASE_ASSET"
