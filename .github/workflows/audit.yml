name: "Audit dependencies"
on:
  push:
    paths:
      # Run if workflow changes
      - .github/workflows/audit.yml
      - .github/actions/setup-toolchain/action.yml
      - justfile
      - pyproject.toml
      - uv.lock
      - rust-toolchain.toml
      # Run on changed dependencies
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - .github/workflows/audit.yml
      - .github/actions/setup-toolchain/action.yml
      - justfile
      - pyproject.toml
      - uv.lock
      - rust-toolchain.toml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  # Rerun periodically to pick up new advisories (weekly instead of daily)
  schedule:
    - cron: "0 6 * * 1" # Monday at 6 AM UTC
  # Run manually
  workflow_dispatch:

# Security: Define minimal required permissions
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Compute week key
        id: date
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache audit database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-v1-${{ steps.date.outputs.week }}
          restore-keys: advisory-db-${{ runner.os }}-v1-

      - name: Run cargo audit
        run: cargo audit

      - name: Write cargo audit JSON
        if: always()
        run: cargo audit --json --no-fetch > audit-results.json

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-results
          path: audit-results.json
