name: Performance Testing

on:
  pull_request:
    branches: [main]
    paths: [
      "src/**",
      "benches/**",
      "tests/**",
      "Cargo.*",
      "rust-toolchain.toml",
      "tooling/**",
      "justfile",
      "pyproject.toml",
      "uv.lock",
      ".github/workflows/performance.yml",
      ".github/actions/setup-toolchain/action.yml",
    ]
  push:
    branches: [main]
    paths: [
      "src/**",
      "benches/**",
      "tests/**",
      "Cargo.*",
      "rust-toolchain.toml",
      "tooling/**",
      "justfile",
      "pyproject.toml",
      "uv.lock",
      ".github/workflows/performance.yml",
      ".github/actions/setup-toolchain/action.yml",
    ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Verify deterministic allocation contract
        run: just allocation-check

      - name: Measure correctness-gated CDT workloads
        run: just bench-latest

      # No legacy cache or inferred historical comparison participates.
      - name: Retain fresh Criterion measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdt-criterion-v2-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
          retention-days: 30
