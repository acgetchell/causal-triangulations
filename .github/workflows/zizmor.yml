name: zizmor

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "42 18 * * 5"
  workflow_dispatch:

jobs:
  analyze:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Fail on workflow findings
        id: audit
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: just zizmor --require-online

      - name: Produce SARIF
        id: sarif
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: just zizmor --require-online --format sarif > "$RUNNER_TEMP/zizmor.sarif"

      - name: Upload security findings
        if: >-
          !cancelled() && steps.sarif.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
