name: CI
permissions:
  contents: read
concurrency:
  group: >
    ci-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repository-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-toolchain
      - name: Run repository tooling checks
        run: just ci-repository-tooling

  build:
    needs: repository-tooling
    if: ${{ always() }}
    env:
      CDT_CI_NATIVE_TOOLS: "1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false # Continue other jobs if one fails
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Require repository tooling success
        if: ${{ cancelled() || needs.repository-tooling.result != 'success' }}
        shell: bash
        run: exit 1

      - name: Disable Git autocrlf on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Consumer changelog tests regenerate real release history.

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          native: "true"

      - name: Check declared Rust target
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup component add clippy
          rustup target add "$RUST_TARGET"
          cargo check --locked --workspace --target "$RUST_TARGET" --all-features --lib --bins

      - name: Run native CI checks
        run: just ci-native

  package:
    needs: build
    if: >-
      github.repository == 'acgetchell/causal-triangulations' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
      artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
      package: ${{ steps.package.outputs.package }}
      validated-attempt: ${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read # The installed evidence creator observes this exact run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared tools without caches
        uses: $/.github/actions/setup-toolchain
        with:
          cache: "false"

      - name: Verify release dependencies
        run: just release-dependency-builds release-dependencies

      - name: Audit locked Cargo dependencies
        run: cargo audit

      - name: Build the library without default features
        run: cargo build --locked --lib --no-default-features

      - name: Run slow scientific tests
        run: just test-slow

      - name: Verify clean default and all-feature Cargo packages
        run: just release-package "$RUNNER_TEMP/cargo-promotion"

      - name: Build packaged public documentation
        run: just cargo-docs causal-triangulations --all-features

      - name: Record the verified archive
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --offline --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "causal-triangulations").version')
          archive="causal-triangulations-$version.crate"
          cargo_identity=$(cargo --version)
          rustc_identity=$(rustc --version --verbose)
          jq -n --arg cargo "$cargo_identity" --arg rustc "$rustc_identity" '{cargo: $cargo, rustc: $rustc}' > "$RUNNER_TEMP/tools.json"
          uvx --no-config --isolated --managed-python --python 3.15 --exclude-newer 2026-11-26T03:45:46Z \
            --from research-repo-tools==0.3.3 research-repo-tools release evidence create tooling/release-evidence.toml \
            --checkout "$PWD" --commit "$GITHUB_SHA" --version "$version" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --tools "$RUNNER_TEMP/tools.json" --archive "$RUNNER_TEMP/cargo-promotion/$archive" --output "$RUNNER_TEMP/cargo-promotion/validation.json"
          printf 'package=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload verified Cargo package
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-promotion/*
          retention-days: 30
          if-no-files-found: error

  sign-package:
    needs: package
    if: >-
      github.repository == 'acgetchell/causal-triangulations' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # No checkout, project environment, or producer code runs with signing rights.
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          enable-cache: false
          cache-python: false

      - name: Authenticate the original package handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact-digest }}
          PACKAGE_NAME: ${{ needs.package.outputs.package }}
          VALIDATED_ATTEMPT: ${{ needs.package.outputs.validated-attempt }}
        working-directory: ${{ runner.temp }}
        shell: uvx --no-config --isolated --managed-python --python 3.15 --exclude-newer 2026-11-26T03:45:46Z --from research-repo-tools==0.3.3 python -I "{0}"
        run: |
          import os, re
          from pathlib import Path
          from research_repo_tools.release_validation import api, artifact_identity, download_artifact
          repository = "acgetchell/causal-triangulations"
          run, attempt = int(os.environ["GITHUB_RUN_ID"]), int(os.environ["GITHUB_RUN_ATTEMPT"])
          if os.environ["VALIDATED_ATTEMPT"] != str(attempt):
              raise ValueError("package producer belongs to a different attempt")
          name = os.environ["PACKAGE_NAME"]
          if not re.fullmatch(r"causal-triangulations-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.crate", name):
              raise ValueError("unexpected Cargo package name")
          identifier = int(os.environ["ARTIFACT_ID"])
          artifact = api(f"actions/artifacts/{identifier}", repository=repository)
          current = api(f"actions/runs/{run}", repository=repository)
          if (current.get("id") != run or current.get("run_attempt") != attempt or current.get("event") != "push"
              or current.get("path") != ".github/workflows/ci.yml" or current.get("head_branch") != "main"
              or current.get("head_sha") != os.environ["GITHUB_SHA"] or current["repository"]["full_name"] != repository
              or current["head_repository"]["full_name"] != repository):
              raise ValueError("package producer run changed")
          artifact = artifact_identity(artifact, current, f"cargo-producer-{run}-{attempt}")
          if artifact["id"] != identifier or artifact["digest"] != "sha256:" + os.environ["ARTIFACT_DIGEST"]:
              raise ValueError("original package handoff identity changed")
          download_artifact(repository, artifact, Path("cargo-promotion"), ("validation.json", name))
          if api(f"actions/runs/{run}", repository=repository).get("run_attempt") != attempt:
              raise ValueError("package producer attempt changed during retrieval")

      - name: Sign the original Cargo manifest
        id: validation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/cargo-promotion/validation.json
          create-storage-record: false

      - name: Retain the original signature
        env:
          VALIDATION_BUNDLE: ${{ steps.validation.outputs.bundle-path }}
        run: cp "$VALIDATION_BUNDLE" "$RUNNER_TEMP/cargo-promotion/validation.sigstore.json"

      - name: Upload signed Cargo evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-promotion/*
          retention-days: 30
          if-no-files-found: error
